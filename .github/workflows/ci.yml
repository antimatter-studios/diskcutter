# Disk Cutter CI gate.
#
# This workflow is the agreed CI bar for PRs and pushes to main: cargo fmt,
# cargo clippy -D warnings and the i18n key-parity check, plus the full test
# suites and the frontend production build. The local guards (github-guard,
# installed into .git/hooks per clone) run the fmt and clippy part before a
# commit; this runs all of it on clean Linux/macOS/Windows runners.
#
# We deliberately do not exercise the macOS DiskArbitration FFI, the
# Linux udev path, or Windows PowerShell disk enumeration against real
# devices — those require physical disks or sandboxing tricks that
# don't belong in CI. `cargo test` is enough; the unit tests don't
# touch real /dev/ nodes or \\.\PhysicalDriveN handles.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            patchelf \
            build-essential \
            file

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # `tauri::generate_context!()` checks `frontendDist` exists at
      # compile time. Without devUrl set in tauri.conf.json (which is the
      # standing project decision — single supported run-mode), every
      # cargo invocation that compiles the lib needs `dist/` on disk.
      # Build the frontend bundle once before clippy + test.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: npm install
        run: npm install

      - name: Frontend build (produces dist/ for tauri::generate_context!)
        run: npm run build

      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: npm install
        run: npm install

      - name: Vitest
        run: npm test

      - name: Production build
        run: npm run build

      - name: i18n key parity
        run: node scripts/check-i18n.mjs
